name: presentation_telemetryserver.yml
# This workflow builds a .NET API project and deploys it to Azure WebApp.
# For more information see: https://unifiedapp-fecwfcdefwe9ewee.uksouth-01.azurewebsites.net/

on:
  push:
    branches:
    - development
permissions:
  id-token: write
env:
  AZURE_WEBAPP_NAME: web-telemetryserver
  AZURE_WEBAPP_PACKAGE_PATH: src/TelemetryService/TelemetryServer/publish
  CONFIGURATION: Development
  DOTNET_CORE_VERSION: 9.0.x
  WORKING_DIRECTORY: src/TelemetryService/TelemetryServer
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
  
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

    - name: Restore
      run: dotnet restore ${{ env.WORKING_DIRECTORY }}

    - name: Build
      run: dotnet build ${{ env.WORKING_DIRECTORY }} --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Test
      run: dotnet test ${{ env.WORKING_DIRECTORY }} --no-build

    - name: Publish
      run: dotnet publish ${{ env.WORKING_DIRECTORY }} --configuration ${{ env.CONFIGURATION }} --no-build --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: webtelemetryservice
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: webtelemetryservice
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    - name: Azure Login
      uses: azure/login@v2
      with:
        # - application(client)id of the appregistration (reg-metronview)
        client-id:  ${{ secrets.AZURE_CLIENTID }}
        # - subscription id
        subscription-id:  ${{ secrets.AZURE_SUBSCRIPTIONID }}
        # - directory/tenant id
        tenant-id: ${{ secrets.AZURE_TENANTID }}
    - name: Deploy to Azure WebApp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    # - name: Import API into Azure API Management
    #   run: az apim api import --path "${{ env.AZURE_APIM_RESOURCE_PATH }}" --resource-group "${{ env.AZURE_APIM_RESOURCEGROUP }}" --service-name "${{ env.AZURE_APIM_SERVICENAME }}" --api-id "${{ env.AZURE_APIM_API_ID }}" --service-url "${{ env.AZURE_APIM_APPSERVICEURL }}" --specification-path "${{ env.API_IMPORT_SPECIFICATION_PATH }}" --specification-format OpenApi --subscription-required false
    - name: logout
      run: >
        az logout
