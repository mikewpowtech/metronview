name: presentation_telemetryserver.yml
# This workflow builds a .NET API project and deploys it to Azure WebApp.
# For more information see: https://unifiedapp-fecwfcdefwe9ewee.uksouth-01.azurewebsites.net/

on:
  push:
    branches:
    - development
permissions:
  id-token: write
env:
  AZURE_WEBAPP_NAME: web-telemetryserver
  AZURE_WEBAPP_PACKAGE_PATH: src/TelemetryService/TelemetryServer/publish
  CONFIGURATION: Development
  DOTNET_CORE_VERSION: 9.0.x
  WORKING_DIRECTORY: src/TelemetryService/TelemetryServer
jobs:
  build:
    name: Ubuntu Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
  
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

    - name: Restore
      run: dotnet restore ${{ env.WORKING_DIRECTORY }}

    - name: Build
      run: dotnet build ${{ env.WORKING_DIRECTORY }} --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Test
      run: dotnet test ${{ env.WORKING_DIRECTORY }} --no-build

    - name: Publish
      run: dotnet publish ${{ env.WORKING_DIRECTORY }} --configuration ${{ env.CONFIGURATION }} --no-build --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

    - name: Copy files to Azure VM via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.AZURE_VM_HOST }}
        username: ${{ secrets.AZURE_VM_USERNAME }}
        password: ${{ secrets.AZURE_VM_PASSWORD }}
        source: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
        target: "/home/${{ secrets.AZURE_VM_USERNAME }}/telemetryserver"

    - name: Restart TelemetryServer service on VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.AZURE_VM_HOST }}
        username: ${{ secrets.AZURE_VM_USERNAME }}
        password: ${{ secrets.AZURE_VM_PASSWORD }}
        script: |
          # Copy appsettings.json from config directory to telemetryserver directory
          cp /home/${{ secrets.AZURE_VM_USERNAME }}/config/appsettings.json /home/${{ secrets.AZURE_VM_USERNAME }}/telemetryserver/appsettings.json
          # Restart the service
          sudo systemctl restart metronview-telemetry-server.service

    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: webtelemetryservice
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}



